<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Scan</title>
<style>
  :root {
    --bg: #F4F6F8; --panel: #FFFFFF; --text: #1F2933; --muted: #52606D; --line: #D9E2EC;
    --accent: #2F6FB0; --warn: #B7791F; --stop: #B83232; --ok: #2E7D4F; --view: #E9EEF3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181D; --panel: #1C2229; --text: #E4E7EB; --muted: #9AA5B1; --line: #323F4B;
            --accent: #63A4E8; --warn: #E3A23B; --stop: #E66A6A; --ok: #5FBF85; --view: #11151A; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 18px; margin: 0; }
  #state { font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--view); }
  #state.running, #state.scanning { color: var(--ok); }
  #state.paused { color: var(--warn); }
  #state.complete { color: var(--stop); }
  #state.stopped, #state.done, #state.replay { color: var(--muted); }
  #summary { color: var(--muted); flex: 1 1 300px; }
  .buttons { display: flex; gap: 8px; }
  button { font: inherit; font-weight: 600; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.stop { color: var(--stop); }
  button.halt { background: var(--stop); border-color: var(--stop); color: #FFFFFF; }
  main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 12px 16px; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  section h2 { font-size: 14px; margin: 0; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; border-bottom: 1px solid var(--line); }
  section h2 .info { color: var(--muted); font-weight: 400; font-size: 12px; }
  .toggle { font-size: 12px; font-weight: 400; display: inline-flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
  .toggle button { padding: 2px 8px; font-size: 12px; border-radius: 6px; }
  .toggle button.on { border-color: var(--accent); color: var(--accent); }
  .toggle .gap { width: 8px; }
  .view { position: relative; height: 380px; background: var(--view); }
  .view canvas { display: block; width: 100%; height: 100%; }
  .view img.frame { width: 100%; height: 100%; object-fit: contain; display: block; }
  .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--muted); padding: 16px; text-align: center; background: var(--view); }
  .empty img { width: 150px; height: auto; opacity: 0.85; }
  .player { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px;
            background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
  .player button { padding: 2px 9px; font-size: 13px; line-height: 1.2; border-radius: 999px; min-width: 32px; }
  .player span { font-size: 12px; color: var(--muted); white-space: nowrap; min-width: 82px; text-align: center; }
  #log { grid-column: 1 / -1; }
  #log pre { margin: 0; padding: 10px 12px; height: 180px; overflow: auto; font: 12px/1.45 ui-monospace, "Liberation Mono", monospace; color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; padding: 6px 12px; border-top: 1px solid var(--line); min-height: 30px; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <h1>Live scan</h1>
  <div id="state">connecting</div>
  <div id="summary"></div>
  <div class="buttons" id="controls">
    <button id="pause">Pause</button>
    <button id="stop" class="stop">End Scan</button>
    <button id="halt" class="halt" title="Halts the arm immediately (arm.stop), no questions asked">STOP</button>
  </div>
</header>
<main>
  <section>
    <h2>Mesh <span class="info" id="meshInfo"></span>
      <span class="toggle"><button id="meshGray" class="on">gray</button><button id="meshColor">color</button><span class="gap"></span><button id="meshFinal">final mesh</button><button id="meshPlay">playback</button></span></h2>
    <div class="view" id="meshView">
      <div class="empty" id="meshEmpty"><img src="viam_logo.svg" alt="Viam"><div id="meshEmptyText">The mesh appears after the first scan view.</div></div>
      <div class="player" id="meshPlayer" hidden><button data-step="-1">◀</button><button data-play>▶</button><button data-step="1">▶▶</button><span></span></div>
    </div>
    <div class="hint" id="meshHint"></div>
  </section>
  <section>
    <h2>Point cloud <span class="info" id="pointsInfo"></span>
      <span class="toggle"><button id="pointsLatest" class="on">latest view</button><button id="pointsAll">all views</button><span class="gap"></span><button id="pointsPlay">playback</button></span></h2>
    <div class="view" id="pointsView">
      <div class="empty" id="pointsEmpty"><img src="viam_logo.svg" alt="Viam"><div>Points appear after the first scan view.</div></div>
      <div class="player" id="pointsPlayer" hidden><button data-step="-1">◀</button><button data-play>▶</button><button data-step="1">▶▶</button><span></span></div>
    </div>
    <div class="hint" id="pointsHint"></div>
  </section>
  <section>
    <h2>RGB-D Camera Feed <span class="info" id="cameraInfo"></span>
      <span class="toggle"><button id="showColor" class="on">color</button><button id="showDepth">depth</button><button id="showHeight">height</button><button id="showMap">map</button><span class="gap"></span><button id="cameraPlay">playback</button></span></h2>
    <div class="view" id="cameraView">
      <img class="frame" id="camera" alt="The latest capture from the wrist camera" hidden>
      <div class="empty" id="cameraEmpty"><img src="viam_logo.svg" alt="Viam"><div id="cameraEmptyText">No capture yet.</div></div>
      <div class="player" id="cameraPlayer" hidden><button data-step="-1">◀</button><button data-play>▶</button><button data-step="1">▶▶</button><span></span></div>
    </div>
    <div class="hint" id="cameraHint"></div>
  </section>
  <section>
    <h2>Monitoring camera <span class="info" id="monitorInfo"></span></h2>
    <div class="view">
      <img class="frame" id="monitor" alt="The monitoring camera, live" hidden>
      <div class="empty" id="monitorEmpty"><img src="viam_logo.svg" alt="Viam"><div id="monitorEmptyText">Waiting for the monitoring camera.</div></div>
    </div>
    <div class="hint" id="monitorHint">Live overview of the scan, up to about 24 frames per second.</div>
  </section>
  <section id="log">
    <h2>Log</h2>
    <pre id="logText"></pre>
  </section>
</main>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { PLYLoader } from "three/addons/loaders/PLYLoader.js";

const $ = (id) => document.getElementById(id);
const loader = new PLYLoader();
const STEP_SECONDS = 0.5;  // playback: each view shown this long, looping back to the first
const README_SECTION = "Section 5.12 of the README";
const AXES = [["X", "#D64545", [1, 0, 0]], ["Y", "#2E9E5B", [0, 1, 0]], ["Z", "#2F6FB0", [0, 0, 1]]];
const CAMERA_COLOR = 0xE8871E;
const step3 = (n) => String(n).padStart(3, "0");

const HINTS = {
  mesh: "Left click to rotate, Right click to pan.",
  final: "The final, closed mesh. Left click to rotate, Right click to pan.",
  pointsLatest: "The latest view's point cloud. Points are colored based upon their corresponding pixel's RGB value.",
  pointsAll: "Combination of all point cloud data collected so far. Data points are thinned for clarity.",
  color: "Latest capture from the RGB-D camera.",
  depth: "Red = near. Blue = Far. Black = no reading.",
  height: "Height above the table: the table one light gray, things on it from blue (low) to red (their tops).",
  map: "The table from above after the survey: scan targets numbered in green, obstacles in gray.",
  playback: "Playback the collected scan data.",
};

// ---------- 3D viewers (mesh and points), with an axes gizmo in the bottom left ----------

function textSprite(text, color) {
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = 64;
  const ctx = canvas.getContext("2d");
  ctx.font = "bold 44px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = color;
  ctx.fillText(text, 32, 34);
  return new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), depthTest: false }));
}

// X red, Y green, Z blue: the robot's world axes, as in the log's coordinates.
function makeAxes() {
  const group = new THREE.Group();
  for (const [name, color, direction] of AXES) {
    const d = new THREE.Vector3(...direction);
    group.add(new THREE.ArrowHelper(d, new THREE.Vector3(), 1, new THREE.Color(color), 0.25, 0.14));
    const sprite = textSprite(name, color);
    sprite.position.copy(d.multiplyScalar(1.3));
    sprite.scale.setScalar(0.5);
    group.add(sprite);
  }
  return group;
}

// The displayed view's camera: lines from its lens to its image's corners, 60mm out.
function cameraOutline(info, depth = 60) {
  const T = info.T_world_cam;
  const at = (x, y, z) => new THREE.Vector3(
    T[0][0] * x + T[0][1] * y + T[0][2] * z + T[0][3],
    T[1][0] * x + T[1][1] * y + T[1][2] * z + T[1][3],
    T[2][0] * x + T[2][1] * y + T[2][2] * z + T[2][3]);
  const lens = at(0, 0, 0);
  const corners = [[0, 0], [info.width, 0], [info.width, info.height], [0, info.height]]
    .map(([u, v]) => at((u - info.cx) / info.fx * depth, (v - info.cy) / info.fy * depth, depth));
  const points = [];
  corners.forEach((corner, k) => points.push(lens, corner, corner, corners[(k + 1) % 4]));
  const top = corners[0].clone().lerp(corners[1], 0.5);
  points.push(top, top.clone().lerp(lens, -0.15));
  return points;
}

function makeViewer(container) {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.autoClear = false;
  container.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue("--view").trim());
  const camera = new THREE.PerspectiveCamera(40, 1, 1, 10000);
  camera.up.set(0, 0, 1);  // the robot's world: z is up, millimeters
  scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6);
  camera.add(sun);  // a light that follows the camera, so every side is lit as you turn it
  sun.position.set(0.5, 1, 0.5);
  scene.add(camera);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  const outline = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: CAMERA_COLOR }));
  outline.visible = false;
  scene.add(outline);
  const gizmoScene = new THREE.Scene();
  gizmoScene.add(makeAxes());
  const gizmoCamera = new THREE.OrthographicCamera(-1.8, 1.8, 1.8, -1.8, 0.1, 20);
  const viewer = { renderer, scene, camera, controls, outline, object: null, framedFor: null, size: [1, 1], loaded: null };
  const resize = () => {
    const { clientWidth: w, clientHeight: h } = container;
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(h, 1);
    camera.updateProjectionMatrix();
    viewer.size = [w, h];
  };
  new ResizeObserver(resize).observe(container);
  resize();
  const loop = () => {
    controls.update();
    const [w, h] = viewer.size;
    renderer.setViewport(0, 0, w, h);
    renderer.setScissorTest(false);
    renderer.clear();
    renderer.render(scene, camera);
    const size = 84;  // the axes gizmo, bottom left, turning with the view
    renderer.setViewport(6, 6, size, size);
    renderer.setScissor(6, 6, size, size);
    renderer.setScissorTest(true);
    renderer.clearDepth();
    gizmoCamera.position.copy(camera.position).sub(controls.target).setLength(5);
    gizmoCamera.up.copy(camera.up);
    gizmoCamera.lookAt(0, 0, 0);
    renderer.render(gizmoScene, gizmoCamera);
    requestAnimationFrame(loop);
  };
  loop();
  return viewer;
}

function show(viewer, object, key) {
  if (viewer.object) {
    viewer.scene.remove(viewer.object);
    viewer.object.geometry.dispose();
  }
  viewer.object = object;
  viewer.scene.add(object);
  if (viewer.framedFor !== key) {  // frame once per object; after that, keep the user's view
    object.geometry.computeBoundingSphere();
    const { center, radius } = object.geometry.boundingSphere;
    viewer.controls.target.copy(center);
    viewer.camera.position.copy(center).add(new THREE.Vector3(-1.4, -1.6, 1.1).multiplyScalar(radius * 1.6));
    viewer.camera.near = radius / 50;
    viewer.camera.far = radius * 50;
    viewer.camera.updateProjectionMatrix();
    viewer.framedFor = key;
  }
}

function load(url) {
  return new Promise((resolve, reject) => loader.load(url, resolve, undefined, reject));
}

const meshViewer = makeViewer($("meshView"));
const pointsViewer = makeViewer($("pointsView"));
const meshMaterial = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, side: THREE.DoubleSide });

// ---------- state ----------

let last = { versions: {}, steps: [], history: 0, current: 0 };
const panels = {
  mesh: { shade: "gray", final: false, play: null },
  points: { mode: "points", play: null },
  camera: { mode: "color", play: null },
};
// play: null (following the scan) or { step, timer } (playback).

function objectKey(status) {
  return `${status.session}/${status.object ? status.object.id : ""}`;
}

// The step a panel shows: its playback position, or the scan's current step.
function shownStep(panel) {
  return panel.play ? panel.play.step : last.current;
}

// ---------- the panels ----------

async function refreshMesh() {
  const panel = panels.mesh;
  let url, info = "";
  if (panel.final) {
    if (!last.final) {
      $("meshEmptyText").textContent = `Final mesh available after the scan is completed. For details about the differences between the live mesh and the final mesh, see ${README_SECTION}.`;
      $("meshEmpty").hidden = false;
      return;
    }
    url = `/files/final_mesh.ply?v=${last.versions.final}`;
    info = `final mesh, ${(last.final_triangles || 0).toLocaleString()} triangles`;
  } else {
    const step = shownStep(panel);
    if (!step) {
      $("meshEmptyText").textContent = "The mesh appears after the first scan view.";
      $("meshEmpty").hidden = false;
      return;
    }
    url = `/files/mesh_${step3(step)}.ply`;
    info = `${step} view${step === 1 ? "" : "s"} fused`;
  }
  const key = `${url}|${panel.shade}`;
  if (meshViewer.loaded === key) return;
  meshViewer.loaded = key;
  try {
    const geometry = await load(url);
    if (meshViewer.loaded !== key) return;  // something newer was asked for meanwhile
    geometry.computeVertexNormals();
    meshMaterial.vertexColors = panel.shade === "color" && geometry.hasAttribute("color");
    meshMaterial.color.set(meshMaterial.vertexColors ? 0xffffff : 0xb8c2cc);
    meshMaterial.needsUpdate = true;
    show(meshViewer, new THREE.Mesh(geometry, meshMaterial), objectKey(last));
    $("meshEmpty").hidden = true;
    $("meshInfo").textContent = info;
  } catch (error) {
    meshViewer.loaded = null;
  }
  placeOutline(meshViewer, panel.final ? 0 : shownStep(panel));
}

async function refreshPoints() {
  const panel = panels.points;
  const step = shownStep(panel);
  if (!step) {
    $("pointsEmpty").hidden = false;
    return;
  }
  const url = `/files/${panel.mode}_${step3(step)}.ply`;
  if (pointsViewer.loaded === url) return;
  pointsViewer.loaded = url;
  try {
    const geometry = await load(url);
    if (pointsViewer.loaded !== url) return;
    const material = new THREE.PointsMaterial({ size: 2.0, vertexColors: geometry.hasAttribute("color") });
    show(pointsViewer, new THREE.Points(geometry, material), objectKey(last));
    $("pointsEmpty").hidden = true;
    $("pointsInfo").textContent = `${geometry.attributes.position.count.toLocaleString()} points`;
  } catch (error) {
    pointsViewer.loaded = null;
  }
  placeOutline(pointsViewer, step);
}

function placeOutline(viewer, step) {
  const info = step ? last.steps[step - 1] : null;
  viewer.outline.visible = Boolean(info);
  if (info) viewer.outline.geometry.setFromPoints(cameraOutline(info));
}

// The camera panel: during a scan (not in playback) the latest capture, which may be a
// survey or board view; in playback, or replaying a saved scan, that step's images.
function refreshCamera() {
  const panel = panels.camera;
  const img = $("camera");
  let url = null;
  if (panel.mode === "map") {
    url = last.versions.map ? `/files/map.png?v=${last.versions.map}` : null;
  } else if (panel.play || last.replay) {
    const step = shownStep(panel);
    url = step ? `/files/${panel.mode}_${step3(step)}.jpg` : null;
  } else if (last.versions[panel.mode]) {
    url = `/files/${panel.mode}.jpg?v=${last.versions[panel.mode]}`;
  }
  if (!url) {
    $("cameraEmptyText").textContent = panel.mode === "map" ? "The map appears after the survey."
      : panel.mode === "height" ? "The height view appears once the survey has measured the table." : "No capture yet.";
    $("cameraEmpty").hidden = false;
    img.hidden = true;
    return;
  }
  if (img.dataset.src !== url) {
    img.dataset.src = url;
    img.src = url;
  }
}
$("camera").onload = () => { $("cameraEmpty").hidden = true; $("camera").hidden = false; };
$("camera").onerror = () => { $("camera").hidden = true; $("cameraEmpty").hidden = false; };


function refreshMonitor() {
  const img = $("monitor");
  if (last.replay) {
    $("monitorEmptyText").textContent = "Monitoring camera unavailable for previous scans.";
    $("monitorEmpty").hidden = false;
    img.hidden = true;
    $("monitorHint").textContent = "";
    return;
  }
  if (!last.monitor) {
    $("monitorEmptyText").textContent = "No monitoring camera: set [live] monitor_camera in config.toml to a camera's name.";
    return;
  }
  if (!img.dataset.started) {  // one long-lived MJPEG stream: the browser shows it as video
    img.dataset.started = "1";
    img.onload = () => { $("monitorEmpty").hidden = true; img.hidden = false; };
    img.onerror = () => { img.hidden = true; $("monitorEmpty").hidden = false; delete img.dataset.started; };
    img.src = "/stream/monitor";
  }
}

// ---------- hints ----------

function refreshHints() {
  $("meshHint").textContent = panels.mesh.play ? HINTS.playback : panels.mesh.final ? HINTS.final : HINTS.mesh;
  $("pointsHint").textContent = panels.points.play ? HINTS.playback : panels.points.mode === "points" ? HINTS.pointsLatest : HINTS.pointsAll;
  $("cameraHint").textContent = panels.camera.play && panels.camera.mode !== "map" ? HINTS.playback : HINTS[panels.camera.mode];
}

// ---------- playback ----------

// Each panel's playback controls and how it redraws.
const PLAYERS = { mesh: ["meshPlayer", refreshMesh], points: ["pointsPlayer", refreshPoints], camera: ["cameraPlayer", refreshCamera] };

function playerLabel(name) {
  const panel = panels[name];
  const player = $(PLAYERS[name][0]);
  player.querySelector("span").textContent = `view ${panel.play.step} of ${Math.max(last.history, 1)}`;
  player.querySelector("[data-play]").textContent = panel.play.timer ? "❚❚" : "▶";
}

function stepTo(name, step) {
  const panel = panels[name];
  panel.play.step = Math.max(1, Math.min(step, Math.max(last.history, 1)));
  playerLabel(name);
  PLAYERS[name][1]();
}

function togglePlaying(name) {
  const panel = panels[name];
  if (panel.play.timer) {
    clearInterval(panel.play.timer);
    panel.play.timer = null;
  } else {
    // Through every view captured so far, then back to the first, until paused.
    const advance = () => stepTo(name, panel.play.step >= last.history ? 1 : panel.play.step + 1);
    panel.play.timer = setInterval(advance, STEP_SECONDS * 1000);
  }
  playerLabel(name);
}

function setPlayback(name, on) {
  const panel = panels[name];
  const button = $(`${name}Play`);
  if (panel.play && panel.play.timer) clearInterval(panel.play.timer);
  panel.play = on ? { step: Math.max(1, last.current || last.history || 1), timer: null } : null;
  button.classList.toggle("on", on);
  $(PLAYERS[name][0]).hidden = !on;
  if (on) playerLabel(name);
  refreshHints();
  PLAYERS[name][1]();
}

for (const name of Object.keys(PLAYERS)) {
  const player = $(PLAYERS[name][0]);
  player.querySelector("[data-play]").onclick = () => togglePlaying(name);
  for (const button of player.querySelectorAll("[data-step]")) {
    button.onclick = () => stepTo(name, panels[name].play.step + Number(button.dataset.step));
  }
  $(`${name}Play`).onclick = () => {
    if (name === "mesh" && panels.mesh.final) setFinal(false);
    setPlayback(name, !panels[name].play);
  };
}

// ---------- toggles ----------

function choose(on, group) {
  for (const id of group) $(id).classList.toggle("on", id === on);
}
function setFinal(on) {
  panels.mesh.final = on;
  $("meshFinal").classList.toggle("on", on);
  if (on && panels.mesh.play) setPlayback("mesh", false);
  refreshHints();
  refreshMesh();
}
$("meshGray").onclick = () => { choose("meshGray", ["meshGray", "meshColor"]); panels.mesh.shade = "gray"; refreshMesh(); };
$("meshColor").onclick = () => { choose("meshColor", ["meshGray", "meshColor"]); panels.mesh.shade = "color"; refreshMesh(); };
$("meshFinal").onclick = () => setFinal(!panels.mesh.final);
$("pointsLatest").onclick = () => { choose("pointsLatest", ["pointsLatest", "pointsAll"]); panels.points.mode = "points"; refreshHints(); refreshPoints(); };
$("pointsAll").onclick = () => { choose("pointsAll", ["pointsLatest", "pointsAll"]); panels.points.mode = "all_points"; refreshHints(); refreshPoints(); };
const CAMERA_BUTTONS = { showColor: "color", showDepth: "depth", showHeight: "height", showMap: "map" };
for (const [id, mode] of Object.entries(CAMERA_BUTTONS)) {
  $(id).onclick = () => { choose(id, Object.keys(CAMERA_BUTTONS)); panels.camera.mode = mode; refreshHints(); refreshCamera(); };
}

// ---------- status ----------

function render(status) {
  const labels = { complete: "scan complete", replay: "saved scan" };
  const state = status.paused && status.state !== "paused" ? "pausing" : status.stopping && !["stopped", "complete"].includes(status.state) ? "stopping" : status.state;
  $("state").textContent = labels[state] || state;
  $("state").className = status.state;
  const parts = [];
  if (status.session) parts.push(`session ${status.session}`);
  if (status.object) parts.push(status.object.description);
  if (status.views) parts.push(status.replay ? `view ${status.current} of ${status.views}` : `view ${status.view} of ${status.views}`);
  if (status.message) parts.push(status.message);
  $("summary").textContent = parts.join(" · ");
  const ended = ["stopped", "done", "complete"].includes(status.state) || status.read_only;
  $("controls").hidden = Boolean(status.replay);
  $("pause").textContent = status.paused ? "Resume" : "Pause";
  $("pause").disabled = ended || status.stopping;
  $("stop").disabled = ended || status.stopping;
  $("halt").disabled = ended;
  const log = $("logText");
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
  log.textContent = status.log.join("\n");
  if (atBottom) log.scrollTop = log.scrollHeight;
  for (const name of Object.keys(PLAYERS)) if (panels[name].play) playerLabel(name);
}

async function poll() {
  try {
    const status = await (await fetch("/api/status")).json();
    last = status;
    render(status);
    refreshMesh();
    refreshPoints();
    refreshCamera();
    refreshMonitor();
  } catch (error) {
    $("state").textContent = "disconnected";
    $("state").className = "stopped";
    $("summary").textContent = "The scan isn't running (its live viewer closes when the program ends).";
  }
  setTimeout(poll, 1000);
}

async function post(action) {
  render(await (await fetch(`/api/${action}`, { method: "POST" })).json());
}
$("pause").onclick = () => post(last.paused ? "resume" : "pause");
$("stop").onclick = () => {
  if (confirm("End the scan before the arm's next move? Views captured so far are kept.")) post("stop");
};
// STOP halts the arm at once: no confirmation, since every second counts.
$("halt").onclick = () => post("stop-now");

refreshHints();
poll();
</script>
</body>
</html>
