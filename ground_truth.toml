# Caliper measurements of the test objects (mm), used by `scan.py compare --objects N --truth NAME`.
# `width` and `length` are the two horizontal sides of a block standing upright;
# the top-level values are the averages of the measurements listed with them, and
# `spread` is their standard deviation.
#
# Treat these as good, not perfect. The objects are cheap toys, not precision parts, and
# their paint thickness varies. The readings depend on how level the calipers are and how
# hard they're pressed (firmly vs. resting: about 0.07mm), so each was taken just snug.
# Diameters were measured at each end and the middle, rotating the object between readings;
# block sides were measured near each end, moving the calipers slightly between readings.

[green_cylinder]
shape = "cylinder"
diameter = 29.78
height = 59.80
# 2026-11-03: 10 at each end and 10 near the middle (end 1 averages 29.84, middle 29.71, end 2
# 29.86), plus the first 3 (2026-10-27). One height reading, 29.79, is left out as a likely typo.

[green_cylinder.spread]
diameter = 0.18
height = 0.09

[green_cylinder.measured]
diameter = [29.51, 29.55, 29.52,
          29.93, 30.00, 30.06, 29.85, 29.59, 29.66, 29.79, 29.60, 29.97, 29.92,
          29.55, 29.80, 29.85, 29.83, 29.55, 29.66, 29.53, 29.64, 29.78, 29.88,
          29.88, 30.09, 29.91, 29.70, 29.65, 29.52, 29.84, 29.87, 30.07, 30.03]
height = [59.93, 59.80, 59.77, 59.71, 59.70, 59.77, 59.77, 59.76, 59.79, 59.97]

