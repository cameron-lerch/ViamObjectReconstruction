# Caliper measurements of the test objects (mm), used by `scan.py compare --objects N --truth NAME`.
# `width` and `length` are the two horizontal sides of a block standing upright;
# the top-level values are the averages of the measurements listed with them.

[green_cylinder]
shape = "cylinder"
diameter = 29.53
height = 59.93
measured = { diameter = [29.51, 29.55, 29.52], height = [59.93] }  # top, middle, bottom

[yellow_block]
shape = "box"
width = 29.26
length = 29.48
height = 60.05
measured = { width = [29.28, 29.26, 29.25], length = [29.45, 29.48, 29.52], height = [60.02, 60.08] }

[orange_block]
shape = "box"
width = 29.73
length = 29.63
height = 60.05
measured = { width = [29.71, 29.77, 29.71], length = [29.66, 29.56, 29.68], height = [60.02, 60.08] }

[red_block]
shape = "box"
width = 30.15
length = 29.18
height = 29.44
measured = { width = [30.15, 30.17, 30.13], length = [29.09, 29.16, 29.29], height = [29.40, 29.48] }

# The 3D-printed objects (calibration/printed_objects/): calipers agree with the CAD within
# 0.15mm (2026-10-29), so these are the CAD dimensions; `cad` is the printed STL, used to map
# the surface error everywhere (tools/compare.py). Black, glossy PLA.

[printed_block]
shape = "box"
width = 40.0
length = 40.0
height = 60.0
cad = "calibration/printed_objects/calibration_block/calibration_block.stl"

[printed_sphere]
shape = "sphere"
diameter = 60.0
cad = "calibration/printed_objects/calibration_sphere/calibration_sphere.stl"

[printed_bowl]
shape = "bowl"
diameter = 130.0       # across the rim
height = 65.0
cad = "calibration/printed_objects/calibration_bowl/calibration_bowl.stl"
