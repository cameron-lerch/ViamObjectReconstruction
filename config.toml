# Settings for this arm cell. Anything left out uses the defaults in
# recon/config.py, where every setting is documented. Distances are mm, world frame.

[machine]
rig = "armfarm14-realsense"    # saved with every session, to tell rigs apart in comparisons
address = "armfarm14-main.310sld03v2.viam.cloud"
credentials = "apikey.json"   # {"key": "...", "key_id": "..."}, kept out of git
arm = "arm"
camera = "cam"
gripper = ""                 # no gripper mounted (2026-10-29); touch-off and relocation are off
motion = "builtin"
# Our calibrated camera mount; the camera frame in the Viam app is then only for its 3D scene.
camera_mount_file = "calibration/armfarm14_camera_mount.json"
touch_off_file = "calibration/armfarm14_touch_off.json"

[workspace]
# Cables rise from around the arm's base on this cell: ignore everything within 350mm of it.
min_base_distance = 350
# Table region searched for objects, clear of the walls (front x=800, side y=425).
x_range = [-350, 700]
y_range = [-650, 350]
# The survey looks straight down from a grid over this region (600mm up, 340mm apart),
# visiting every reachable point. To use fixed positions instead: survey_positions = [[x, y, z], ...]

[views]
standoff = 280               # camera to nearest point of the object
elevations_deg = [15, 25, 50, 72]
azimuth_step_deg = 30
min_coverage = 0.85          # below this, the object is moved to a scan station
min_camera_height = 80       # no view puts the camera lower than this above the table (mm)

[capture]
settle_s = 0.6               # pause after each move before taking frames
frames_per_view = 5          # per-pixel median of this many frames

[relocate]
# Off until the gripper numbers below are measured and pick and place is tested.
enabled = false
# All 37 views plan at the first two on armfarm14 (planned 2026-10-26).
stations = [[350, -250], [300, -350], [400, -150]]
# Measure these on the real gripper before enabling relocation with --execute.
max_grasp_width = 80
fingertip_offset = 0
jaw_axis_offset_deg = 0
return_after_scan = true

[reconstruct]
voxel = 1.5
device = "auto"              # CUDA when available

[live]
# The live viewer (http://localhost:8765 during every arm run; see README 5.12).
enabled = true
port = 8765
monitor_camera = "webcam"    # a Viam camera component watching the whole cell ("" for none)
monitor_fps = 24             # its live stream's frame rate (it shares the cloud connection with the scan)
