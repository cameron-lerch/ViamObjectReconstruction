# Lengths in mm. See ../README.md.

name = "calibration_sphere"
description = "Sphere, 60mm across"

[files]
cad = "calibration_sphere.step"
mesh = "calibration_sphere.stl"       # millimeters, same pose as the STEP file

[placement]
resting_face = "the bottom of the sphere (the print sits flat; the CAD is a full sphere touching at one point)"
bottom_at_z0 = true

[print]
printer = ""
material = "PLA"
color = "black, glossy"            # hard for the RealSense: dark absorbs, gloss reflects its infrared pattern
# layer_height = 0.2   # unknown: fill in
# nozzle = 0.4         # unknown: fill in
# infill_percent = 20  # unknown: fill in
date = "2026-10-29"

[measured]
# Calipers agree with the CAD within 0.15mm (2026-10-29).
diameter = 60.0

notes = "First scans (2026-10-29) were bumpy: black glossy plastic gives the RealSense patchy depth. A matte, light reprint (or matte primer) is planned."
