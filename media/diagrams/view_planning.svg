<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="580" viewBox="0 0 1180 580" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #1F2933; }
      .label { font-size: 14px; fill: #3E4C59; }
      .bold { font-size: 15px; font-weight: 700; fill: #1F2933; }
      .desc { font-size: 13px; fill: #52606D; }
      .ray { stroke: #9FB3C8; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
      .ring { stroke: #C1CCD7; stroke-width: 1.5; fill: none; }
      .dim { stroke: #4A5568; stroke-width: 1.5; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="1180" height="580" rx="16" fill="#FFFFFF"/>
  <text x="590" y="40" text-anchor="middle" class="title">View planning: rings of camera poses around each object (side view)</text>

  <!-- table and object -->
  <rect x="40" y="470" width="660" height="16" fill="#D9E2EC"/>
  <text x="50" y="506" class="desc">table (plane fit from the depth data)</text>
  <rect x="345" y="390" width="50" height="80" fill="#3E9C5A" rx="3"/>
  <circle cx="370" cy="438" r="4" fill="#1F2933"/>
  <text x="404" y="436" class="desc">aim point: 40% up the object</text>

  <!-- arc of radius 320 around (370,438) -->
  <path d="M60,438 A310,310 0 0,1 680,438" class="ring"/>
  <!-- cameras: top (90), 72, 50, 25 on left side -->
  <line x1="370" y1="438" x2="370" y2="128" class="ray"/>
  <line x1="370" y1="438" x2="274" y2="143" class="ray"/>
  <line x1="370" y1="438" x2="171" y2="200" class="ray"/>
  <line x1="370" y1="438" x2="89" y2="307" class="ray"/>
  <line x1="370" y1="438" x2="71" y2="358" class="ray"/>
  <g fill="#2F6FB0">
    <rect x="356" y="114" width="28" height="18" rx="3"/>
    <rect x="260" y="129" width="28" height="18" rx="3" transform="rotate(18 274 138)"/>
    <rect x="157" y="186" width="28" height="18" rx="3" transform="rotate(40 171 195)"/>
    <rect x="75" y="293" width="28" height="18" rx="3" transform="rotate(65 89 302)"/>
    <rect x="57" y="349" width="28" height="18" rx="3" transform="rotate(75 71 358)"/>
  </g>
  <text x="392" y="112" class="label">top view (90°)</text>
  <text x="208" y="118" class="label">72° ring</text>
  <text x="96" y="178" class="label">50° ring</text>
  <text x="20" y="276" class="label">25° ring</text>
  <text x="14" y="398" class="label">15° ring</text>
  <!-- mirrored ring hints -->
  <g fill="#B8CDE3">
    <rect x="452" y="129" width="28" height="18" rx="3" transform="rotate(-18 466 138)"/>
    <rect x="555" y="186" width="28" height="18" rx="3" transform="rotate(-40 569 195)"/>
    <rect x="637" y="293" width="28" height="18" rx="3" transform="rotate(-65 651 302)"/>
    <rect x="655" y="349" width="28" height="18" rx="3" transform="rotate(-75 669 358)"/>
  </g>
  <line x1="370" y1="438" x2="651" y2="307" class="dim"/>
  <text x="470" y="415" class="label" transform="rotate(-25 470 415)">280mm standoff + object radius</text>

  <!-- right column: explanation -->
  <text x="740" y="100" class="bold">Candidates</text>
  <text x="740" y="122" class="desc">1 top view + 4 rings × 12 azimuths (every 30°) = 49.</text>
  <text x="740" y="140" class="desc">Alternate rings are offset by 15° so seams don't line up.</text>
  <text x="740" y="158" class="desc">280mm keeps the RealSense beyond its ~260mm minimum range.</text>
  <text x="740" y="176" class="desc">No view puts the camera under 80mm above the table.</text>

  <text x="740" y="214" class="bold">Reachability (no motion)</text>
  <text x="740" y="236" class="desc">Each pose goes to Viam's motion planner as "plan only":</text>
  <text x="740" y="254" class="desc">IK, joint limits, collisions with the configured table and</text>
  <text x="740" y="272" class="desc">walls, every detected object, and the measured table.</text>
  <text x="740" y="290" class="desc">The camera may roll about its axis (0°, 180°, ±90°): the</text>
  <text x="740" y="308" class="desc">roll needing the least joint motion wins, and the wrist</text>
  <text x="740" y="326" class="desc">stays within ±200° so the camera cable doesn't wind up.</text>

  <text x="740" y="364" class="bold">Coverage</text>
  <text x="740" y="386" class="desc">~600 surface directions around the object (not the</text>
  <text x="740" y="404" class="desc">bottom). A direction is covered if a reachable camera lies</text>
  <text x="740" y="422" class="desc">within 55° of it. Under 85% covered: relocate the object.</text>

  <text x="740" y="460" class="bold">Order</text>
  <text x="740" y="482" class="desc">Top view first, then ring by ring downward, reversing</text>
  <text x="740" y="500" class="desc">direction each ring, so moves between views stay short.</text>
</svg>
