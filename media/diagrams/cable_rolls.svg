<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FB2"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D64545"/></marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #1F2933; }
      .head { font-size: 17px; font-weight: 700; fill: #1F2933; }
      .bold { font-size: 15px; font-weight: 700; fill: #1F2933; }
      .desc { font-size: 13.5px; fill: #52606D; }
      .small { font-size: 12.5px; fill: #52606D; }
      .warn { font-size: 13.5px; fill: #C23B3B; }
      .big { font-size: 34px; font-weight: 700; fill: #1F2933; }
      .flow { stroke: #4A5568; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="1240" height="620" rx="16" fill="#FFFFFF"/>
  <text x="620.0" y="42.0" text-anchor="middle" class="title">Choosing each view's camera roll, so the camera cable doesn't wind up</text>
  <rect x="30" y="150" width="190" height="84" rx="10" fill="#F5F7FA" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="125.0" y="180.0" text-anchor="middle" class="bold">Candidate view</text>
  <text x="125.0" y="199.0" text-anchor="middle" class="small">where the camera goes</text>
  <text x="125.0" y="215.0" text-anchor="middle" class="small">and what it looks at</text>
  <rect x="260" y="78" width="950" height="262" rx="14" fill="none" stroke="#9AA5B1" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="282.0" y="104.0" text-anchor="start" class="bold">For each of the 4 camera rolls about the direction it looks: 0°, 180°, 90°, −90°</text>
  <rect x="290" y="150" width="225" height="84" rx="10" fill="#F5F7FA" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="402.5" y="180.0" text-anchor="middle" class="bold">Plan-only request</text>
  <text x="402.5" y="199.0" text-anchor="middle" class="small">to Viam's motion service;</text>
  <text x="402.5" y="215.0" text-anchor="middle" class="small">the arm doesn't move</text>
  <path d="M640,140 L722,192 L640,244 L558,192 Z" fill="#FFF8E6" stroke="#D9A21B" stroke-width="1.5"/>
  <text x="640.0" y="189.0" text-anchor="middle" class="bold">Plan</text>
  <text x="640.0" y="205.0" text-anchor="middle" class="bold">found?</text>
  <path d="M855,130 L960,192 L855,254 L750,192 Z" fill="#FFF8E6" stroke="#D9A21B" stroke-width="1.5"/>
  <text x="855.0" y="181.0" text-anchor="middle" class="bold">Last joint within</text>
  <text x="855.0" y="197.0" text-anchor="middle" class="bold">±200° of its zero</text>
  <text x="855.0" y="213.0" text-anchor="middle" class="bold">at the end?</text>
  <rect x="1015" y="157" width="175" height="70" rx="10" fill="#EAF6EC" stroke="#2F9E44" stroke-width="1.5"/>
  <text x="1102.5" y="188.5" text-anchor="middle" class="bold">Roll kept</text>
  <text x="1102.5" y="207.5" text-anchor="middle" class="small">with its end joints</text>
  <rect x="560" y="268" width="400" height="54" rx="10" fill="#FDECEC" stroke="#D64545" stroke-width="1.5"/>
  <text x="760.0" y="291.5" text-anchor="middle" class="bold">Roll rejected</text>
  <text x="760.0" y="310.5" text-anchor="middle" class="small">out of reach, a collision, or the wrist too far; its reason is kept</text>
  <line x1="220" y1="192" x2="288" y2="192" class="flow"/>
  <line x1="515" y1="192" x2="556" y2="192" class="flow"/>
  <line x1="722" y1="192" x2="748" y2="192" class="flow"/>
  <text x="735.0" y="184.0" text-anchor="middle" class="small">yes</text>
  <line x1="960" y1="192" x2="1013" y2="192" class="flow"/>
  <text x="986.5" y="184.0" text-anchor="middle" class="small">yes</text>
  <line x1="640" y1="244" x2="640" y2="266" class="flow"/>
  <text x="654.0" y="259.0" text-anchor="middle" class="small">no</text>
  <line x1="855" y1="254" x2="855" y2="266" class="flow"/>
  <text x="869.0" y="262.0" text-anchor="middle" class="small">no</text>
  <path d="M620,368 L730,420 L620,472 L510,420 Z" fill="#FFF8E6" stroke="#D9A21B" stroke-width="1.5"/>
  <text x="620.0" y="417.0" text-anchor="middle" class="bold">Any roll</text>
  <text x="620.0" y="433.0" text-anchor="middle" class="bold">kept?</text>
  <line x1="620" y1="340" x2="620" y2="366" class="flow"/>
  <rect x="200" y="388" width="290" height="64" rx="10" fill="#FDECEC" stroke="#D64545" stroke-width="1.5"/>
  <text x="345.0" y="416.5" text-anchor="middle" class="bold">View unreachable: skipped</text>
  <text x="345.0" y="435.5" text-anchor="middle" class="small">with the most common reason</text>
  <line x1="510" y1="420" x2="492" y2="420" class="flow"/>
  <text x="501.0" y="412.0" text-anchor="middle" class="small">no</text>
  <rect x="790" y="384" width="400" height="72" rx="10" fill="#EAF6EC" stroke="#2F9E44" stroke-width="1.5"/>
  <text x="990.0" y="408.0" text-anchor="middle" class="bold">Keep the roll closest to the previous view</text>
  <text x="990.0" y="427.0" text-anchor="middle" class="small">the smallest maximum joint change from</text>
  <text x="990.0" y="443.0" text-anchor="middle" class="small">the previous view's end joints</text>
  <line x1="730" y1="420" x2="788" y2="420" class="flow"/>
  <text x="759.0" y="412.0" text-anchor="middle" class="small">yes</text>
  <rect x="790" y="486" width="400" height="56" rx="10" fill="#F5F7FA" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="990.0" y="510.5" text-anchor="middle" class="bold">Next view</text>
  <text x="990.0" y="529.5" text-anchor="middle" class="small">compared against this one's end joints</text>
  <line x1="990" y1="456" x2="990" y2="484" class="flow"/>
  <rect x="30" y="486" width="720" height="104" rx="10" fill="#FFFFFF" stroke="#D64545" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="46.0" y="512.0" text-anchor="start" class="warn">Not checked here: during the scan, each view is reached with an ordinary motion.move,</text>
  <text x="46.0" y="531.0" text-anchor="start" class="warn">and Viam plans that move again from wherever the arm is. A pose fixes the last joint only</text>
  <text x="46.0" y="550.0" text-anchor="start" class="warn">up to a full turn, so the wrist can end 360° away from its plan, and nothing checks</text>
  <text x="46.0" y="569.0" text-anchor="start" class="warn">its angle after the move.</text>
</svg>