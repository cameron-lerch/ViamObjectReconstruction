<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="640" viewBox="0 0 1320 640" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #1F2933; }
      .lane { font-size: 14px; font-weight: 700; fill: #616E7C; letter-spacing: 0.5px; }
      .name { font-size: 17px; font-weight: 700; fill: #1F2933; }
      .desc { font-size: 13px; fill: #52606D; }
      .cmd { font-size: 12.5px; fill: #3E4C59; font-family: "Liberation Mono", monospace; }
      .note { font-size: 13.5px; fill: #3E4C59; font-style: italic; }
      .edge { stroke: #4A5568; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #4A5568; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="1320" height="640" rx="16" fill="#FFFFFF"/>
  <text x="660" y="40" text-anchor="middle" class="title">ViamObjectReconstruction: pipeline</text>

  <!-- robot lane -->
  <rect x="24" y="64" width="1272" height="232" rx="14" fill="#F0F4F8" stroke="#BCCCDC" stroke-width="1.5"/>
  <text x="44" y="90" class="lane">ON THE ROBOT  ·  the arm moves only with --execute</text>

  <rect x="44" y="104" width="384" height="150" rx="12" fill="#FFFFFF" stroke="#9FB3C8" stroke-width="1.5"/>
  <text x="62" y="132" class="name">1. Survey</text>
  <text x="62" y="156" class="desc">Camera looks straight down from fixed</text>
  <text x="62" y="174" class="desc">positions. Per view: fit the table plane,</text>
  <text x="62" y="192" class="desc">cluster what stands on it into boxed</text>
  <text x="62" y="210" class="desc">objects.</text>
  <text x="62" y="240" class="cmd">scan.py survey</text>

  <rect x="480" y="104" width="384" height="150" rx="12" fill="#FFFFFF" stroke="#9FB3C8" stroke-width="1.5"/>
  <text x="498" y="132" class="name">2. Plan views</text>
  <text x="498" y="156" class="desc">Rings of camera poses around each object.</text>
  <text x="498" y="174" class="desc">Each is checked by Viam's planner without</text>
  <text x="498" y="192" class="desc">moving; coverage is scored from what is</text>
  <text x="498" y="210" class="desc">reachable.</text>
  <text x="498" y="240" class="cmd">scan.py plan</text>

  <rect x="916" y="104" width="360" height="150" rx="12" fill="#FFFFFF" stroke="#9FB3C8" stroke-width="1.5"/>
  <text x="934" y="132" class="name">3. Capture, stop-and-go</text>
  <text x="934" y="156" class="desc">Move, stop, settle 0.6s, take the median</text>
  <text x="934" y="174" class="desc">of N fresh frames, read the camera pose,</text>
  <text x="934" y="192" class="desc">check it against the arm controller.</text>
  <text x="934" y="210" class="desc">Save to disk.</text>
  <text x="934" y="240" class="cmd">scan.py scan --execute</text>

  <path d="M428,179 L476,179" class="edge"/>
  <path d="M864,179 L912,179" class="edge"/>

  <!-- saved data -->
  <rect x="968" y="312" width="308" height="62" rx="12" fill="#FFF8E7" stroke="#E0B85A" stroke-width="1.5"/>
  <text x="1122" y="338" text-anchor="middle" class="name">Saved views</text>
  <text x="1122" y="360" text-anchor="middle" class="desc">color, depth (mm), camera pose, joints</text>
  <path d="M1122,254 L1122,308" class="edge"/>

  <!-- offline lane -->
  <rect x="24" y="392" width="1272" height="232" rx="14" fill="#F2FAF4" stroke="#9CCFAE" stroke-width="1.5"/>
  <text x="44" y="418" class="lane">OFFLINE  ·  re-run as often as you like on the saved views</text>

  <rect x="968" y="432" width="308" height="150" rx="12" fill="#FFFFFF" stroke="#9CCFAE" stroke-width="1.5"/>
  <text x="986" y="460" class="name">4. Calibrate camera mount</text>
  <text x="986" y="484" class="desc">Once per setup: the one correction</text>
  <text x="986" y="502" class="desc">to the camera's mounting pose that</text>
  <text x="986" y="520" class="desc">makes all views of a still scene</text>
  <text x="986" y="538" class="desc">agree.</text>
  <text x="986" y="568" class="cmd">scan.py calibrate</text>

  <rect x="660" y="432" width="280" height="150" rx="12" fill="#FFFFFF" stroke="#9CCFAE" stroke-width="1.5"/>
  <text x="678" y="460" class="name">5. Align views</text>
  <text x="678" y="484" class="desc">One joint point-to-plane ICP over</text>
  <text x="678" y="502" class="desc">all overlapping view pairs; each</text>
  <text x="678" y="520" class="desc">view is held near its arm pose.</text>
  <text x="678" y="568" class="cmd">scan.py reconstruct</text>

  <rect x="352" y="432" width="280" height="150" rx="12" fill="#FFFFFF" stroke="#9CCFAE" stroke-width="1.5"/>
  <text x="370" y="460" class="name">6. Fuse (TSDF)</text>
  <text x="370" y="484" class="desc">Crop each depth map to the object,</text>
  <text x="370" y="502" class="desc">average signed distances in 1.5mm</text>
  <text x="370" y="520" class="desc">voxels; keep surface seen by 2+</text>
  <text x="370" y="538" class="desc">views: observed.obj</text>

  <rect x="44" y="432" width="280" height="150" rx="12" fill="#FFFFFF" stroke="#9CCFAE" stroke-width="1.5"/>
  <text x="62" y="460" class="name">7. Close with a flat bottom</text>
  <text x="62" y="484" class="desc">Poisson surface through observed</text>
  <text x="62" y="502" class="desc">points + footprint on the table +</text>
  <text x="62" y="520" class="desc">straight walls where unseen:</text>
  <text x="62" y="538" class="desc">mesh.obj (watertight)</text>
  <text x="62" y="568" class="cmd">scan.py progression</text>

  <path d="M1122,374 L1122,428" class="edge"/>
  <path d="M964,507 L944,507" class="edge"/>
  <path d="M656,507 L636,507" class="edge"/>
  <path d="M348,507 L328,507" class="edge"/>

  <text x="660" y="612" text-anchor="middle" class="note">progression: the same steps with 1, 2, ... n of the views, to measure what each added view buys</text>
</svg>
